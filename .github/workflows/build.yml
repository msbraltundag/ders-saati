name: Ders Saati APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Hazırla
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android Proje Dosyalarını Oluştur
        run: |
          mkdir -p app/src/main/java/com/derssaati/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # settings.gradle
          cat << 'EOF' > settings.gradle
          rootProject.name = "DersSaati"
          include ':app'
          EOF

          # build.gradle (Root)
          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }

          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          apply plugin: 'com.android.application'
          apply plugin: 'kotlin-android'

          android {
              namespace 'com.derssaati.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.derssaati.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "1.2"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
          }
          EOF

          # Manifest (Uyanma ve kilit açılış izinleri eklendi)
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_recent_history"
                  android:label="Ders Saati"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".DersWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                          <action android:name="com.derssaati.app.ACTION_AUTO_UPDATE" />
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.USER_PRESENT" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          # Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Ders Saati</string>
          </resources>
          EOF

          # Widget Arka Planı
          cat << 'EOF' > app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#212121" />
              <corners android:radius="18dp" />
              <stroke android:width="1.5dp" android:color="#33B5E5" />
          </shape>
          EOF

          # Widget XML Tanımı
          cat << 'EOF' > app/src/main/res/xml/widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="40dp"
              android:minHeight="40dp"
              android:targetCellWidth="1"
              android:targetCellHeight="1"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal|vertical" />
          EOF

          # Widget Layout (Dokunma kimliği eklendi)
          cat << 'EOF' > app/src/main/res/layout/widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/widgetRoot"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="4dp">

              <TextView
                  android:id="@+id/tvTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:gravity="center"
                  android:maxLines="1"
                  android:ellipsize="end"
                  android:text="1. Ders"
                  android:textColor="#80D8FF"
                  android:textSize="12sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvCountdown"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="2dp"
                  android:gravity="center"
                  android:text="-- dk"
                  android:textColor="#00E676"
                  android:textSize="16sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          # Activity Main Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="16dp"
              android:background="#F8F9FA">
              
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Ders Saati Ayarları"
                      android:textSize="22sp"
                      android:textColor="#212121"
                      android:textStyle="bold"
                      android:layout_marginBottom="12dp"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Düzenlenecek Günü Seçin:"
                      android:textColor="#424242"
                      android:textStyle="bold"
                      android:textSize="14sp"/>

                  <Spinner
                      android:id="@+id/spDays"
                      android:layout_width="match_parent"
                      android:layout_height="48dp"
                      android:layout_marginTop="6dp"
                      android:background="#E2E8F0"
                      android:padding="8dp"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="O Güne Ait Ders Saatleri:"
                      android:textColor="#424242"
                      android:textStyle="bold"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Format: Başlangıç-Bitiş-DersAdı"
                      android:textColor="#757575"
                      android:textSize="12sp"
                      android:layout_marginBottom="6dp"/>

                  <EditText
                      android:id="@+id/etSchedule"
                      android:layout_width="match_parent"
                      android:layout_height="180dp"
                      android:gravity="top|start"
                      android:background="#FFFFFF"
                      android:padding="10dp"
                      android:textColor="#212121"
                      android:fontFamily="monospace"
                      android:textSize="13sp" />

                  <Button
                      android:id="@+id/btnCopyToAll"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:text="Bu Saatleri Tüm Hafta İçi Günlerine Kopyala"
                      android:textSize="11sp"/>

                  <Switch
                      android:id="@+id/switchNotification"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="12dp"
                      android:text="Zil Bildirimleri"
                      android:textSize="15sp"
                      android:checked="false"/>

                  <Button
                      android:id="@+id/btnSave"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="Seçili Günü Kaydet ve Canlı Başlat"
                      android:padding="12dp"/>
              </LinearLayout>
          </ScrollView>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/derssaati/app/MainActivity.kt
          package com.derssaati.app

          import android.app.Activity
          import android.content.Context
          import android.os.Bundle
          import android.view.View
          import android.widget.*
          import java.util.Calendar

          class MainActivity : Activity() {

              private val days = arrayOf("Pazartesi", "Salı", "Çarşamba", "Perşembe", "Cuma", "Cumartesi", "Pazar")
              private val dayCalendarCodes = intArrayOf(
                  Calendar.MONDAY,
                  Calendar.TUESDAY,
                  Calendar.WEDNESDAY,
                  Calendar.THURSDAY,
                  Calendar.FRIDAY,
                  Calendar.SATURDAY,
                  Calendar.SUNDAY
              )

              private var currentSelectedDayIndex = 0

              private val defaultSchedule = 
                  "08:30-09:10-1. Ders\n" +
                  "09:10-09:20-Teneffüs\n" +
                  "09:20-10:00-2. Ders\n" +
                  "10:00-10:10-Teneffüs\n" +
                  "10:10-10:50-3. Ders\n" +
                  "10:50-11:00-Teneffüs\n" +
                  "11:00-11:40-4. Ders\n" +
                  "11:40-12:30-Öğle Arası\n" +
                  "12:30-13:10-5. Ders\n" +
                  "13:10-13:20-Teneffüs\n" +
                  "13:20-14:00-6. Ders"

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val spDays = findViewById<Spinner>(R.id.spDays)
                  val etSchedule = findViewById<EditText>(R.id.etSchedule)
                  val switchNotification = findViewById<Switch>(R.id.switchNotification)
                  val btnSave = findViewById<Button>(R.id.btnSave)
                  val btnCopyToAll = findViewById<Button>(R.id.btnCopyToAll)

                  val prefs = getSharedPreferences("DersSaatiPrefs", Context.MODE_PRIVATE)

                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, days)
                  spDays.adapter = adapter

                  spDays.onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                      override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                          currentSelectedDayIndex = position
                          val dayCode = dayCalendarCodes[position]
                          val savedDayData = prefs.getString("schedule_day_$dayCode", null)
                          if (savedDayData != null) {
                              etSchedule.setText(savedDayData)
                          } else {
                              if (dayCode == Calendar.SATURDAY || dayCode == Calendar.SUNDAY) {
                                  etSchedule.setText("")
                              } else {
                                  etSchedule.setText(defaultSchedule)
                              }
                          }
                      }
                      override fun onNothingSelected(parent: AdapterView<*>?) {}
                  }

                  switchNotification.isChecked = prefs.getBoolean("notifications_enabled", false)

                  btnCopyToAll.setOnClickListener {
                      val currentText = etSchedule.text.toString()
                      val editor = prefs.edit()
                      val weekdays = intArrayOf(Calendar.MONDAY, Calendar.TUESDAY, Calendar.WEDNESDAY, Calendar.THURSDAY, Calendar.FRIDAY)
                      for (w in weekdays) {
                          editor.putString("schedule_day_$w", currentText)
                      }
                      editor.apply()
                      Toast.makeText(this, "Bu saatler Pzt-Cuma arasına kopyalandı!", Toast.LENGTH_SHORT).show()
                  }

                  btnSave.setOnClickListener {
                      val dayCode = dayCalendarCodes[currentSelectedDayIndex]
                      prefs.edit()
                          .putString("schedule_day_$dayCode", etSchedule.text.toString())
                          .putBoolean("notifications_enabled", switchNotification.isChecked)
                          .apply()

                      Toast.makeText(this, "${days[currentSelectedDayIndex]} programı kaydedildi!", Toast.LENGTH_SHORT).show()

                      // Canlı döngüyü hemen tetikle
                      DersWidget.updateAllWidgets(this)
                  }
              }
          }
          EOF

          # DersWidget.kt (Saniyeli Canlı Döngü ve Tıklanabilir Motor)
          cat << 'EOF' > app/src/main/java/com/derssaati/app/DersWidget.kt
          package com.derssaati.app

          import android.app.AlarmManager
          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Build
          import android.widget.RemoteViews
          import java.util.Calendar

          class DersWidget : AppWidgetProvider() {

              companion object {
                  const val ACTION_AUTO_UPDATE = "com.derssaati.app.ACTION_AUTO_UPDATE"

                  fun updateAllWidgets(context: Context) {
                      val appWidgetManager = AppWidgetManager.getInstance(context)
                      val thisWidget = ComponentName(context, DersWidget::class.java)
                      val appWidgetIds = appWidgetManager.getAppWidgetIds(thisWidget)
                      for (id in appWidgetIds) {
                          updateWidget(context, appWidgetManager, id)
                      }
                      scheduleNextMinute(context)
                  }

                  private fun scheduleNextMinute(context: Context) {
                      val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as? AlarmManager ?: return
                      val intent = Intent(context, DersWidget::class.java).apply {
                          action = ACTION_AUTO_UPDATE
                      }
                      val pendingIntent = PendingIntent.getBroadcast(
                          context, 0, intent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )

                      // Bir sonraki tam 00. saniyeyi hedefle
                      val nextMinute = Calendar.getInstance().apply {
                          add(Calendar.MINUTE, 1)
                          set(Calendar.SECOND, 0)
                          set(Calendar.MILLISECOND, 0)
                      }.timeInMillis

                      try {
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                              alarmManager.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, nextMinute, pendingIntent)
                          } else {
                              alarmManager.setExact(AlarmManager.RTC_WAKEUP, nextMinute, pendingIntent)
                          }
                      } catch (e: Exception) {
                          try {
                              alarmManager.set(AlarmManager.RTC_WAKEUP, nextMinute, pendingIntent)
                          } catch (ex: Exception) { }
                      }
                  }

                  fun updateWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                      val views = RemoteViews(context.packageName, R.layout.widget_layout)
                      val prefs = context.getSharedPreferences("DersSaatiPrefs", Context.MODE_PRIVATE)

                      val cal = Calendar.getInstance()
                      val todayCode = cal.get(Calendar.DAY_OF_WEEK)
                      val nowMin = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)

                      val rawData = prefs.getString("schedule_day_$todayCode", "") ?: ""

                      var status = "Ders Yok"
                      var countdown = "--"

                      if (rawData.isNotBlank()) {
                          val lines = rawData.split("\n")
                          var found = false

                          for (line in lines) {
                              val parts = line.trim().split("-")
                              if (parts.size >= 3) {
                                  val startMin = timeToMin(parts[0])
                                  val endMin = timeToMin(parts[1])
                                  val title = parts[2]

                                  if (nowMin in startMin until endMin) {
                                      status = title
                                      val rem = endMin - nowMin
                                      countdown = "$rem dk"
                                      found = true
                                      break
                                  }
                              }
                          }

                          if (!found) {
                              status = "Bitti"
                              for (line in lines) {
                                  val parts = line.trim().split("-")
                                  if (parts.size >= 3) {
                                      val startMin = timeToMin(parts[0])
                                      if (startMin > nowMin) {
                                          status = parts[2]
                                          val rem = startMin - nowMin
                                          countdown = "$rem dk"
                                          found = true
                                          break
                                      }
                                  }
                              }
                          }
                      } else {
                          status = "Tatil"
                          countdown = "Zil Yok"
                      }

                      views.setTextViewText(R.id.tvTitle, status)
                      views.setTextViewText(R.id.tvCountdown, countdown)

                      // Widget'a tıklanınca anında tazeleme
                      val clickIntent = Intent(context, DersWidget::class.java).apply {
                          action = ACTION_AUTO_UPDATE
                      }
                      val clickPendingIntent = PendingIntent.getBroadcast(
                          context, appWidgetId, clickIntent,
                          PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                      )
                      views.setOnClickPendingIntent(R.id.widgetRoot, clickPendingIntent)

                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }

                  private fun timeToMin(timeStr: String): Int {
                      return try {
                          val p = timeStr.trim().split(":")
                          p[0].toInt() * 60 + p[1].toInt()
                      } catch (e: Exception) { 0 }
                  }
              }

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  updateAllWidgets(context)
              }

              override fun onReceive(context: Context, intent: Intent) {
                  super.onReceive(context, intent)
                  if (intent.action == ACTION_AUTO_UPDATE || 
                      intent.action == Intent.ACTION_USER_PRESENT || 
                      intent.action == Intent.ACTION_BOOT_COMPLETED) {
                      updateAllWidgets(context)
                  }
              }

              override fun onEnabled(context: Context) {
                  super.onEnabled(context)
                  updateAllWidgets(context)
              }

              override fun onDisabled(context: Context) {
                  super.onDisabled(context)
                  val alarmManager = context.getSystemService(Context.ALARM_SERVICE) as? AlarmManager
                  val intent = Intent(context, DersWidget::class.java).apply {
                      action = ACTION_AUTO_UPDATE
                  }
                  val pendingIntent = PendingIntent.getBroadcast(
                      context, 0, intent,
                      PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                  )
                  alarmManager?.cancel(pendingIntent)
              }
          }
          EOF

      - name: APK Derle
        run: gradle assembleDebug

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: DersSaati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
