name: Ders Saati APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu Hazırla
        uses: actions/checkout@v4

      - name: Java 17 Kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Gradle 8.5 Kur
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Android Proje Dosyalarını Oluştur
        run: |
          mkdir -p app/src/main/java/com/derssaati/app
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          rootProject.name = "DersSaati"
          include ':app'
          EOF

          # build.gradle (Root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.derssaati.app'
              compileSdk 34

              defaultConfig {
                  applicationId "com.derssaati.app"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              // Harici kütüphane yok - Tamamen yerel Android SDK
          }
          EOF

          # Manifest
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/ic_menu_recent_history"
                  android:label="Ders Saati"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".DersWidget"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
              </application>
          </manifest>
          EOF

          # Strings
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Ders Saati</string>
          </resources>
          EOF

          # Widget Arka Planı
          cat << 'EOF' > app/src/main/res/drawable/widget_bg.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1E1E2C" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          # Widget XML Tanımı
          cat << 'EOF' > app/src/main/res/xml/widget_info.xml
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="140dp"
              android:minHeight="80dp"
              android:updatePeriodMillis="60000"
              android:initialLayout="@layout/widget_layout"
              android:resizeMode="horizontal|vertical" />
          EOF

          # Widget Layout
          cat << 'EOF' > app/src/main/res/layout/widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="12dp">

              <TextView
                  android:id="@+id/tvTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Ders Saati"
                  android:textColor="#B0BEC5"
                  android:textSize="18sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvCountdown"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:text="-- dk kaldı"
                  android:textColor="#00E676"
                  android:textSize="24sp"
                  android:textStyle="bold" />
          </LinearLayout>
          EOF

          # Activity Main Layout
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <ScrollView xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:padding="20dp"
              android:background="#F5F5F5">
              
              <LinearLayout
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:orientation="vertical">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Ders Saati Ayarları"
                      android:textSize="22sp"
                      android:textColor="#212121"
                      android:textStyle="bold"
                      android:layout_marginBottom="16dp"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Ders ve Teneffüs Saatleri:"
                      android:textColor="#424242"
                      android:textStyle="bold"/>

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="Format: Başlangıç-Bitiş-DersAdı"
                      android:textColor="#757575"
                      android:textSize="12sp"
                      android:layout_marginBottom="8dp"/>

                  <EditText
                      android:id="@+id/etSchedule"
                      android:layout_width="match_parent"
                      android:layout_height="220dp"
                      android:gravity="top|start"
                      android:background="#FFFFFF"
                      android:padding="12dp"
                      android:textColor="#212121"
                      android:fontFamily="monospace"
                      android:textSize="14sp" />

                  <Switch
                      android:id="@+id/switchNotification"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="16dp"
                      android:text="Zil Çalınca Bildirim Gönder"
                      android:textSize="16sp"
                      android:checked="false"/>

                  <Button
                      android:id="@+id/btnSave"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="20dp"
                      android:text="Kaydet ve Widget'ı Güncelle"
                      android:padding="12dp"/>
              </LinearLayout>
          </ScrollView>
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/derssaati/app/MainActivity.kt
          package com.derssaati.app

          import android.app.Activity
          import android.appwidget.AppWidgetManager
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Switch
          import android.widget.Toast

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val etSchedule = findViewById<EditText>(R.id.etSchedule)
                  val switchNotification = findViewById<Switch>(R.id.switchNotification)
                  val btnSave = findViewById<Button>(R.id.btnSave)

                  val prefs = getSharedPreferences("DersSaatiPrefs", Context.MODE_PRIVATE)
                  
                  val defaultSchedule = 
                      "08:30-09:10-1. Ders\n" +
                      "09:10-09:20-Teneffüs\n" +
                      "09:20-10:00-2. Ders\n" +
                      "10:00-10:10-Teneffüs\n" +
                      "10:10-10:50-3. Ders\n" +
                      "10:50-11:00-Teneffüs\n" +
                      "11:00-11:40-4. Ders\n" +
                      "11:40-12:30-Öğle Arası\n" +
                      "12:30-13:10-5. Ders\n" +
                      "13:10-13:20-Teneffüs\n" +
                      "13:20-14:00-6. Ders"

                  etSchedule.setText(prefs.getString("schedule_data", defaultSchedule))
                  switchNotification.isChecked = prefs.getBoolean("notifications_enabled", false)

                  btnSave.setOnClickListener {
                      prefs.edit()
                          .putString("schedule_data", etSchedule.text.toString())
                          .putBoolean("notifications_enabled", switchNotification.isChecked)
                          .apply()

                      Toast.makeText(this, "Program Kaydedildi!", Toast.LENGTH_SHORT).show()

                      val intent = Intent(this, DersWidget::class.java).apply {
                          action = AppWidgetManager.ACTION_APPWIDGET_UPDATE
                          val ids = AppWidgetManager.getInstance(application).getAppWidgetIds(
                              ComponentName(application, DersWidget::class.java)
                          )
                          putExtra(AppWidgetManager.EXTRA_APPWIDGET_IDS, ids)
                      }
                      sendBroadcast(intent)
                  }
              }
          }
          EOF

          # DersWidget.kt
          cat << 'EOF' > app/src/main/java/com/derssaati/app/DersWidget.kt
          package com.derssaati.app

          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.Context
          import android.widget.RemoteViews
          import java.util.Calendar

          class DersWidget : AppWidgetProvider() {

              override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                  for (appWidgetId in appWidgetIds) {
                      updateWidget(context, appWidgetManager, appWidgetId)
                  }
              }

              companion object {
                  fun updateWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                      val views = RemoteViews(context.packageName, R.layout.widget_layout)
                      val prefs = context.getSharedPreferences("DersSaatiPrefs", Context.MODE_PRIVATE)
                      val rawData = prefs.getString("schedule_data", "") ?: ""

                      val cal = Calendar.getInstance()
                      val nowMin = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)

                      var status = "Dersler Bitti"
                      var countdown = "--"

                      val lines = rawData.split("\n")
                      var found = false

                      for (line in lines) {
                          val parts = line.trim().split("-")
                          if (parts.size >= 3) {
                              val startMin = timeToMin(parts[0])
                              val endMin = timeToMin(parts[1])
                              val title = parts[2]

                              if (nowMin in startMin until endMin) {
                                  status = title
                                  val rem = endMin - nowMin
                                  countdown = "$rem dk kaldı"
                                  found = true
                                  break
                              }
                          }
                      }

                      if (!found) {
                          for (line in lines) {
                              val parts = line.trim().split("-")
                              if (parts.size >= 3) {
                                  val startMin = timeToMin(parts[0])
                                  if (startMin > nowMin) {
                                      status = "Sıradaki: " + parts[2]
                                      val rem = startMin - nowMin
                                      countdown = "$rem dk kaldı"
                                      found = true
                                      break
                                  }
                              }
                          }
                      }

                      views.setTextViewText(R.id.tvTitle, status)
                      views.setTextViewText(R.id.tvCountdown, countdown)
                      appWidgetManager.updateAppWidget(appWidgetId, views)
                  }

                  private fun timeToMin(timeStr: String): Int {
                      return try {
                          val p = timeStr.trim().split(":")
                          p[0].toInt() * 60 + p[1].toInt()
                      } catch (e: Exception) { 0 }
                  }
              }
          }
          EOF

      - name: APK Derle
        run: gradle assembleDebug --stacktrace

      - name: APK Dosyasını Yükle
        uses: actions/upload-artifact@v4
        with:
          name: DersSaati-APK
          path: app/build/outputs/apk/debug/app-debug.apk
